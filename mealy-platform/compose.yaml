name: mealy-platform

x-backend: &backend
  build:
    context: ./apps/backend
  env_file:
    - ./apps/backend/.env
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MEALY_DB_NAME:-mealy}
      POSTGRES_USER: ${MEALY_DB_USER:-mealy}
      POSTGRES_PASSWORD: ${MEALY_DB_PASSWORD:?Set MEALY_DB_PASSWORD}
    ports:
      - "${MEALY_BIND_ADDRESS:-127.0.0.1}:${MEALY_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mealy_postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: ./apps/backend
    env_file:
      - ./apps/backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/migrate.js"]
    restart: "no"

  api:
    <<: *backend
    command: ["node", "dist/api.js"]
    ports:
      - "${MEALY_BIND_ADDRESS:-127.0.0.1}:${MEALY_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  realtime:
    <<: *backend
    command: ["node", "dist/realtime.js"]
    ports:
      - "${MEALY_BIND_ADDRESS:-127.0.0.1}:${MEALY_REALTIME_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]

volumes:
  mealy_postgres_data:
